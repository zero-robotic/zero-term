[package]
name = "zero-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
alacritty_terminal = "0.26.0"
zui-app = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2", default-features = false, features = ["gpu", "clipboard"] }
zui-platform = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }

zui-types = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }
zui-input = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }
zui-paint = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }
zui-api = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }
zui-text = { git = "https://github.com/zero-robotic/zero-ui", rev = "1fcc39669e1f51494169bfea3af10d7e6cf845a2" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0
incremental = false
